ktlint:
  Indentation:
    active: true
    indentSize: 2
  FinalNewline:
    insertFinalNewLine: false
  FunctionSignature:
    active: true
    indentSize: 2
  ClassSignature:
    active: false
  ChainMethodContinuation:
    active: false
  FunctionExpressionBody:
    active: false
  TrailingCommaOnCallSite:
    active: false
  NoEmptyFirstLineInClassBody:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: [ 'Composable' ]

performance:
  SpreadOperator:
    active: false

style:
  MagicNumber:
    active: false
  NewLineAtEndOfFile:
    active: false